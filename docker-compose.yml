version: '3.9'

services: 
  postgres:
    image: postgres:17
    container_name: legacy_postgres
    environment:
      POSTGRES_DB: Legacy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: 
      - "5434:5432"
    volumes: 
      - postgres-data:/var/lib/postgresql/data

  profile: 
    build: 
      context: .
      dockerfile: src/Profile/Legacy.Profile.API/Dockerfile
    container_name: profile-api
    ports: 
      - "5001:8080"
    depends_on:
      - postgres
volumes: 
  postgres-data: